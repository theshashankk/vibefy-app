name: Build & Sign Android Release (Secure - Zero Hardcoded Passwords)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build & Sign Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Grant execute permissions for Gradlew
        run: chmod +x gradlew

      - name: 4. Secure Dynamic Cloud Signing (Zero Leaked Credentials)
        run: |
          # Generate a single-use cryptographically secure random password per build run
          SECURE_PASS=$(openssl rand -hex 16)
          echo "KEYSTORE_PASSWORD=$SECURE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$SECURE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=musicwtf" >> $GITHUB_ENV
          echo "KEYSTORE_FILE=release-upload-keystore.jks" >> $GITHUB_ENV

          keytool -genkey -v \
            -keystore app/release-upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias musicwtf \
            -dname "CN=Music WTF, OU=Vibefy, O=Vibefy, L=Global, ST=Global, C=US" \
            -storepass "$SECURE_PASS" \
            -keypass "$SECURE_PASS"

      - name: 5. Build & Sign Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 6. Upload Signed Release APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: 7. Upload Release AAB (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB-PlayStore
          path: app/build/outputs/bundle/release/*.aab
