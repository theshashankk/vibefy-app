name: Build & Sign Android Release APK (Automatic)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle Engine
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Generate Automatic Cloud Keystore
        run: |
          SECURE_PASS=$(openssl rand -hex 16)
          echo "KEYSTORE_PASSWORD=$SECURE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$SECURE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=musicwtf" >> $GITHUB_ENV
          echo "KEYSTORE_FILE=release-upload-keystore.jks" >> $GITHUB_ENV

          TARGET_DIR="app"
          if [ -d "musicwtf-android/app" ]; then
            TARGET_DIR="musicwtf-android/app"
          fi

          keytool -genkey -v \
            -keystore "$TARGET_DIR/release-upload-keystore.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias musicwtf \
            -dname "CN=Music WTF, OU=Vibefy, O=Vibefy, L=Global, ST=Global, C=US" \
            -storepass "$SECURE_PASS" \
            -keypass "$SECURE_PASS"

      - name: 5. Build & Sign Release APK
        run: |
          if [ -d "musicwtf-android" ]; then
            cd musicwtf-android
          fi
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 6. Upload Signed Release APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MusicWTF-Signed-Release-APK
          path: "**/app/build/outputs/apk/release/*.apk"

      - name: 7. Publish APK to GitHub Releases Tab
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: main
          tag_name: v1.0.0
          name: "Gaane (Music WTF) v1.0.0"
          body: |
            ⚡ **Gaane (Music WTF) Native Android Release v1.0.0**
            
            - **Download & Install**: Grab `MusicWTF-v1.0.0-release.apk` below directly on your phone.
            - **68 Creator Vibe-Sites**: Vintage dashboards, monsoon stages, & saloon.wtf player.
            - **Offline Support**: Offline caching and background sync.
          files: "**/app/build/outputs/apk/release/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
