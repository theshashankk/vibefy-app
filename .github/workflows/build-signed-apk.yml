name: Build & Sign Android Release (APK & AAB)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build & Sign Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Grant execute permissions for Gradlew
        run: chmod +x gradlew

      - name: 4. Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 5. Decode Release Keystore (if secret provided)
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-upload-keystore.jks

      - name: 6. Sign Release APK (if secret provided)
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        uses: rstepanyan/sign-android-release-action@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: 7. Upload Signed Release APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: 8. Upload Release AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB-PlayStore
          path: app/build/outputs/bundle/release/*.aab
